name: ELKA Linux Professional Master Build
on:
  workflow_dispatch: # Manuel tetikleme butonu
  push:
    branches: [ main ]

jobs:
  build-elka-os:
    runs-on: ubuntu-22.04
    timeout-minutes: 120 # Uzun süreceği için süreyi artırdık
    
    steps:
      - name: 1. Depoyu Kontrol Et
        uses: actions/checkout@v4

      - name: 2. Gerekli İnşa Paketlerini Sisteme Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap squashfs-tools xorriso grub-pc-bin \
            grub-efi-amd64-bin mtools dosfstools libisoburn1 \
            python3-tk curl wget rsync qemu-utils coreutils \
            linux-image-amd64 live-boot cpio bc gdisk

      - name: 3. Çalışma Dizinlerini Oluştur
        run: |
          # Temiz ve izole çalışma alanları
          mkdir -p build/chroot
          mkdir -p build/image/live
          mkdir -p build/image/boot/grub
          mkdir -p build/image/isolinux
          mkdir -p config/elka-installer

      - name: 4. Debian Bookworm Base (Debootstrap)
        run: |
          # Minimal ama sağlam bir taban kurulumu
          sudo debootstrap --arch=amd64 --variant=minbase bookworm build/chroot http://deb.debian.org/debian/

      - name: 5. ELKA Sistem Özelleştirme (Derinlemesine Chroot)
        run: |
          # Chroot içinde çalışacak devasa yapılandırma betiği
          cat <<'EOF' > build/chroot/elka_os_core.sh
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive
          export LC_ALL=C
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          # --- /usr/bin/env Eksikse Giderilmesi ---
          if [ ! -f /usr/bin/env ]; then ln -s /usr/bin/coreutils /usr/bin/env; fi

          # --- Repo Yapılandırması (Main + Contrib + Non-Free + Security) ---
          cat <<R > /etc/apt/sources.list
          deb http://deb.debian.org/debian/ bookworm main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian/ bookworm-updates main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          R
          
          apt-get update

          # --- Kernel ve Firmware (Intel i5 ve tüm donanımlar için tam destek) ---
          apt-get install -y --no-install-recommends \
            linux-image-amd64 live-boot systemd-sysv sudo network-manager \
            firmware-linux firmware-linux-nonfree firmware-realtek \
            firmware-iwlwifi firmware-amd-graphics intel-microcode \
            pipewire pipewire-audio-client-libraries alsa-utils \
            bluetooth bluez rfkill brightnessctl

          # --- KDE Plasma ve Grafik Arayüz (Okul İçin Optimize) ---
          apt-get install -y --no-install-recommends \
            kde-plasma-desktop sddm plasma-nm konsole dolphin \
            kio-extras kscreen kde-config-gtk-style kde-style-breeze \
            plasma-pa okular gwenview kcalc ark xdg-utils

          # --- EĞİTİM VE TOOL SETİ (TAM LİSTE) ---
          apt-get install -y \
            libreoffice-qt5 libreoffice-l10n-tr \
            vlc gimp scratch geany tuxpaint gcompris-qt \
            firefox-esr-l10n-tr htop neofetch nano wget curl git \
            build-essential python3-full python3-tk python3-pil \
            zip unzip p7zip-full synaptic gdebi-core

          # --- Türkçe Dil ve Yerelleştirme ---
          apt-get install -y locales
          echo "tr_TR.UTF-8 UTF-8" > /etc/locale.gen
          locale-gen
          echo "LANG=tr_TR.UTF-8" > /etc/default/locale
          echo "Europe/Istanbul" > /etc/timezone
          ln -fs /usr/share/zoneinfo/Europe/Istanbul /etc/localtime

          # --- Kullanıcı Hesapları ve Yetkilendirme ---
          # 'ogrenci' hesabı: Şifresiz, kısıtlı
          useradd -m -s /bin/bash ogrenci
          passwd -d ogrenci
          
          # 'ogretmen' hesabı: Sudo yetkili
          useradd -m -s /bin/bash ogretmen
          echo "ogretmen:elka123" | chpasswd
          usermod -aG sudo ogretmen

          # --- Polkit Kuralları (Disk ve USB Güvenliği) ---
          mkdir -p /etc/polkit-1/rules.d/
          cat <<P > /etc/polkit-1/rules.d/50-elka-security.rules
          polkit.addRule(function(action, subject) {
              if (action.id.indexOf("org.freedesktop.udisks2.filesystem-mount") == 0) {
                  if (subject.user == "ogretmen") return polkit.Result.YES;
                  return polkit.Result.AUTH_ADMIN;
              }
          });
          P

          # --- SDDM Otomatik Giriş (Öğrenci Hesabına) ---
          mkdir -p /etc/sddm.conf.d/
          echo -e "[Autologin]\nUser=ogrenci\nSession=plasma.desktop\nRelogin=false" > /etc/sddm.conf.d/autologin.conf

          # --- KDE Başlangıç Optimizasyonları (Default Settings) ---
          mkdir -p /etc/skel/.config
          echo "[Icons]\nTheme=breeze-dark" > /etc/skel/.config/kdeglobals
          
          # --- Temizlik ---
          apt-get autoremove -y
          apt-get clean
          EOF

          # Mount ve Chroot İşlemi
          sudo mount --bind /dev build/chroot/dev
          sudo mount --bind /proc build/chroot/proc
          sudo mount --bind /sys build/chroot/sys
          sudo mount --bind /dev/pts build/chroot/dev/pts

          sudo chmod +x build/chroot/elka_os_core.sh
          sudo chroot build/chroot /bin/bash /elka_os_core.sh

          # Güvenli Unmount
          sudo umount -l build/chroot/dev/pts || true
          sudo umount -l build/chroot/dev || true
          sudo umount -l build/chroot/proc || true
          sudo umount -l build/chroot/sys || true
          sudo rm build/chroot/elka_os_core.sh

      - name: 6. ELKA Installer GUI (Özel Geliştirilmiş Sürüm)
        run: |
          # Installer Python Kodunu Hazırla
          sudo mkdir -p build/chroot/usr/local/bin
          cat <<'EOF' | sudo tee build/chroot/usr/local/bin/elka-installer.py
          import tkinter as tk
          from tkinter import messagebox, ttk
          import subprocess
          import os

          class ElkaInstaller:
              def __init__(self, root):
                  self.root = root
                  self.root.title("ELKA Linux Yapılandırma Sihirbazı")
                  self.root.geometry("600x450")
                  self.root.configure(bg="#2c3e50")
                  
                  # Tasarım öğeleri
                  self.style = ttk.Style()
                  self.style.configure("TButton", font=("Arial", 11))
                  
                  self.header = tk.Label(root, text="ELKA LINUX", font=("Arial", 24, "bold"), fg="#3498db", bg="#2c3e50")
                  self.header.pack(pady=20)
                  
                  self.info = tk.Label(root, text="Okul sistemine hoş geldiniz.\nLütfen öğretmen şifresini belirleyerek sistemi kilitleyin.", 
                                       fg="white", bg="#2c3e50", font=("Arial", 10))
                  self.info.pack(pady=10)

                  # Şifre alanları
                  tk.Label(root, text="Yeni Öğretmen Şifresi:", fg="white", bg="#2c3e50").pack()
                  self.pwd1 = tk.Entry(root, show="*", width=30, font=("Arial", 12))
                  self.pwd1.pack(pady=5)
                  
                  tk.Label(root, text="Şifreyi Tekrarla:", fg="white", bg="#2c3e50").pack()
                  self.pwd2 = tk.Entry(root, show="*", width=30, font=("Arial", 12))
                  self.pwd2.pack(pady=5)

                  # USB Kısıtlama Seçeneği
                  self.usb_var = tk.BooleanVar(value=True)
                  self.usb_chk = tk.Checkbutton(root, text="Öğrenci USB Yetkilerini Sınırla (Önerilen)", 
                                                variable=self.usb_var, fg="white", bg="#2c3e50", selectcolor="#34495e")
                  self.usb_chk.pack(pady=15)

                  self.btn = tk.Button(root, text="SİSTEMİ TAMAMLA", command=self.apply, 
                                       bg="#27ae60", fg="white", font=("Arial", 12, "bold"), padx=20, pady=10)
                  self.btn.pack(pady=20)

              def apply(self):
                  p1 = self.pwd1.get()
                  if p1 != self.pwd2.get() or len(p1) < 4:
                      messagebox.showerror("Hata", "Şifreler eşleşmiyor veya çok kısa (Min 4)!")
                      return
                  
                  try:
                      # Şifre güncelleme
                      subprocess.run(f"echo 'ogretmen:{p1}' | chpasswd", shell=True, check=True)
                      
                      # Kendini silme (Tek seferlik çalışma)
                      if os.path.exists("/etc/xdg/autostart/elka-installer.desktop"):
                          os.remove("/etc/xdg/autostart/elka-installer.desktop")
                      
                      messagebox.showinfo("Başarılı", "ELKA Linux başarıyla yapılandırıldı.\nSistem şimdi yeniden başlatılacak.")
                      os.system("reboot")
                  except Exception as e:
                      messagebox.showerror("Hata", f"Sistem güncellenirken hata oluştu: {e}")

          if __name__ == "__main__":
              root = tk.Tk()
              app = ElkaInstaller(root)
              root.mainloop()
          EOF
          sudo chmod +x build/chroot/usr/local/bin/elka-installer.py

          # Autostart: Öğrenci masaüstü açıldığında otomatik çalışsın
          sudo mkdir -p build/chroot/etc/xdg/autostart
          cat <<EOF | sudo tee build/chroot/etc/xdg/autostart/elka-installer.desktop
          [Desktop Entry]
          Type=Application
          Name=ELKA Installer
          Exec=sudo /usr/bin/python3 /usr/local/bin/elka-installer.py
          Terminal=false
          X-GNOME-Autostart-enabled=true
          EOF

          # Sudoers: Şifresiz çalıştırma izni
          echo "ogrenci ALL=(ALL) NOPASSWD: /usr/bin/python3 /usr/local/bin/elka-installer.py" | sudo tee -a build/chroot/etc/sudoers

      - name: 7. ISO İnşası (Hybrid & UEFI Destekli)
        run: |
          # 1. RootFS SquashFS Sıkıştırma (En yüksek sıkıştırma - XZ)
          sudo mksquashfs build/chroot build/image/live/filesystem.squashfs -comp xz -noappend
          
          # 2. Kernel ve Initrd kopyalama (Dinamik isimle)
          KERNEL_PATH=$(ls build/chroot/boot/vmlinuz-* | head -n 1)
          INITRD_PATH=$(ls build/chroot/boot/initrd.img-* | head -n 1)
          cp "$KERNEL_PATH" build/image/live/vmlinuz
          cp "$INITRD_PATH" build/image/live/initrd
          
          # 3. Grub Yapılandırması
          cat <<EOF > build/image/boot/grub/grub.cfg
          set timeout=3
          set default=0
          insmod all_video
          
          menuentry "ELKA Linux v1.0 [Okul Modu]" {
              linux /live/vmlinuz boot=live quiet splash persistence ---
              initrd /live/initrd
          }
          
          menuentry "ELKA Linux (Güvenli Mod)" {
              linux /live/vmlinuz boot=live nomodeset quiet splash
              initrd /live/initrd
          }
          EOF
          
          # 4. Profesyonel ISO Üretimi
          grub-mkrescue -o elka-linux-master.iso build/image

      - name: 8. ISO'yu Yayınla
        uses: actions/upload-artifact@v4
        with:
          name: ELKA-Linux-Ultimate-ISO
          path: elka-linux-master.iso
          
