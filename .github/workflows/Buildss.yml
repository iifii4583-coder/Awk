name: ELKA Linux Ultimate Production Build
on:
  workflow_dispatch: # Manuel kontrol paneli

jobs:
  build-elka-os:
    runs-on: ubuntu-22.04
    timeout-minutes: 180 # Devasa paket kurulumu için süre artırıldı
    
    steps:
      - name: 1. Kaynak Kod ve Hazırlık
        uses: actions/checkout@v4

      - name: 2. Sistem İnşa Bağımlılıklarını Kur (Full Toolset)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap squashfs-tools xorriso grub-pc-bin \
            grub-efi-amd64-bin mtools dosfstools libisoburn1 \
            python3-tk curl wget rsync qemu-utils coreutils \
            cpio bc gdisk live-build imagemagick build-essential

      - name: 3. Profesyonel Dizin Mimarisi Oluşturma
        run: |
          mkdir -p build/chroot
          mkdir -p build/image/live
          mkdir -p build/image/boot/grub
          mkdir -p build/image/isolinux
          mkdir -p build/staging/branding

      - name: 4. Debian Bookworm Base System (Debootstrap)
        run: |
          # En kararlı taban olan Debian 12 (Bookworm) çekirdeğini atıyoruz
          sudo debootstrap --arch=amd64 --variant=minbase bookworm build/chroot http://deb.debian.org/debian/

      - name: 5. ELKA Master Chroot Script (Sistemin Kalbi)
        run: |
          # Bu betik, sistemin içindeki her bir ayarı, vidayı sıkar gibi yapılandırır
          cat <<'EOF' > build/chroot/elka_master.sh
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive
          export LC_ALL=C
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          # --- HATA ÖNLEYİCİ: Dosya Sistemi Onarımları ---
          if [ ! -f /usr/bin/env ]; then ln -s /usr/bin/coreutils /usr/bin/env; fi

          # --- REPO YAPILANDIRMASI (Full Mirror) ---
          cat <<R > /etc/apt/sources.list
          deb http://deb.debian.org/debian/ bookworm main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian/ bookworm-updates main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          R
          
          apt-get update

          # --- ÇEKİRDEK VE DONANIM (Intel i5 & Modern Sistemler) ---
          apt-get install -y --no-install-recommends \
            linux-image-amd64 live-boot systemd-sysv sudo network-manager \
            firmware-linux firmware-linux-nonfree firmware-realtek \
            firmware-iwlwifi firmware-intel-sound intel-microcode \
            pipewire pipewire-audio-client-libraries alsa-utils \
            bluetooth bluez rfkill brightnessctl pciutils usbutils

          # --- PERFORMANS OPTİMİZASYONLARI (i5 İçin Özel) ---
          apt-get install -y zram-tools cpufrequtils
          echo "ALGO=lz4" >> /etc/default/zramswap
          echo "PERCENT=25" >> /etc/default/zramswap

          # --- KDE PLASMA MASAÜSTÜ (Eğitim Odaklı Tasarım) ---
          apt-get install -y --no-install-recommends \
            kde-plasma-desktop sddm plasma-nm konsole dolphin \
            kio-extras kscreen kde-config-gtk-style kde-style-breeze \
            plasma-pa okular gwenview kcalc ark xdg-utils \
            sweeper kfind breeze-icon-theme

          # --- DEVASA EĞİTİM VE ARAÇ SETİ ---
          apt-get install -y \
            libreoffice-qt5 libreoffice-l10n-tr \
            vlc gimp scratch geany tuxpaint gcompris-qt \
            firefox-esr-l10n-tr htop neofetch nano wget curl git \
            build-essential python3-full python3-tk python3-pil \
            zip unzip p7zip-full synaptic gdebi-core thunderbird-l10n-tr

          # --- YERELLEŞTİRME (Tam Türkçe Desteği) ---
          apt-get install -y locales
          echo "tr_TR.UTF-8 UTF-8" > /etc/locale.gen
          locale-gen
          echo "LANG=tr_TR.UTF-8" > /etc/default/locale
          echo "Europe/Istanbul" > /etc/timezone
          ln -fs /usr/share/zoneinfo/Europe/Istanbul /etc/localtime

          # --- KULLANICI VE GÜVENLİK YÖNETİMİ ---
          # 'ogrenci': Sınırları belli, güvenli liman
          useradd -m -s /bin/bash ogrenci
          passwd -d ogrenci
          
          # 'ogretmen': Sistemin yöneticisi
          useradd -m -s /bin/bash ogretmen
          echo "ogretmen:elka123" | chpasswd
          usermod -aG sudo ogretmen

          # --- POLKIT: Derin Güvenlik Kuralları ---
          mkdir -p /etc/polkit-1/rules.d/
          cat <<P > /etc/polkit-1/rules.d/50-elka-master.rules
          polkit.addRule(function(action, subject) {
              if (action.id.indexOf("org.freedesktop.udisks2.filesystem-mount") == 0) {
                  if (subject.user == "ogretmen") return polkit.Result.YES;
                  return polkit.Result.AUTH_ADMIN;
              }
              if (action.id == "org.freedesktop.packagekit.system-sources-configure" && subject.user == "ogrenci") {
                  return polkit.Result.NO;
              }
          });
          P

          # --- SDDM OTOMATİK GİRİŞ ---
          mkdir -p /etc/sddm.conf.d/
          echo -e "[Autologin]\nUser=ogrenci\nSession=plasma.desktop\nRelogin=false" > /etc/sddm.conf.d/autologin.conf

          # --- TEMİZLİK OPERASYONU ---
          apt-get autoremove -y
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          EOF

          # Mount - Chroot - Unmount Döngüsü
          sudo mount --bind /dev build/chroot/dev
          sudo mount --bind /proc build/chroot/proc
          sudo mount --bind /sys build/chroot/sys
          sudo mount --bind /dev/pts build/chroot/dev/pts

          sudo chmod +x build/chroot/elka_master.sh
          sudo chroot build/chroot /bin/bash /elka_master.sh

          sudo umount -l build/chroot/dev/pts || true
          sudo umount -l build/chroot/dev || true
          sudo umount -l build/chroot/proc || true
          sudo umount -l build/chroot/sys || true
          sudo rm build/chroot/elka_master.sh

      - name: 6. ELKA Installer & OOBE Professional Suite
        run: |
          # İlk açılış sihirbazının Python kodu (Gelişmiş Versiyon)
          sudo mkdir -p build/chroot/usr/local/bin
          cat <<'EOF' | sudo tee build/chroot/usr/local/bin/elka-installer.py
          import tkinter as tk
          from tkinter import messagebox, ttk
          import subprocess
          import os

          class ElkaOSWizard:
              def __init__(self, root):
                  self.root = root
                  self.root.title("ELKA Linux Dağıtım Yapılandırması")
                  self.root.geometry("600x500")
                  self.root.configure(bg="#1a1a1a")
                  
                  # Stil ayarları
                  self.label_style = {"bg": "#1a1a1a", "fg": "#00d4ff", "font": ("Arial", 12)}
                  
                  tk.Label(root, text="ELKA LINUX v1.0", font=("Arial", 28, "bold"), fg="#00d4ff", bg="#1a1a1a").pack(pady=20)
                  tk.Label(root, text="Sistemi kullanmaya başlamadan önce lütfen\nöğretmen hesabınız için güvenli bir şifre belirleyin.", 
                           bg="#1a1a1a", fg="white", font=("Arial", 10)).pack(pady=10)

                  # Şifre Girişleri
                  self.p1_label = tk.Label(root, text="Yeni Öğretmen Şifresi:", **self.label_style).pack(pady=5)
                  self.p1 = tk.Entry(root, show="*", width=35, font=("Arial", 14), justify='center')
                  self.p1.pack(pady=5)
                  
                  self.p2_label = tk.Label(root, text="Şifreyi Onaylayın:", **self.label_style).pack(pady=5)
                  self.p2 = tk.Entry(root, show="*", width=35, font=("Arial", 14), justify='center')
                  self.p2.pack(pady=5)

                  # İlerleme Çubuğu
                  self.progress = ttk.Progressbar(root, orient="horizontal", length=400, mode="determinate")
                  self.progress.pack(pady=20)

                  self.btn = tk.Button(root, text="YAPILANDIRMAYI TAMAMLA", command=self.finalize, 
                                       bg="#00d4ff", fg="black", font=("Arial", 12, "bold"), padx=30, pady=15)
                  self.btn.pack(pady=20)

              def finalize(self):
                  pwd = self.p1.get()
                  if pwd != self.p2.get() or len(pwd) < 6:
                      messagebox.showerror("Hata", "Şifreler eşleşmiyor veya 6 karakterden kısa!")
                      return
                  
                  self.progress.start()
                  try:
                      # Şifreyi uygula
                      subprocess.run(f"echo 'ogretmen:{pwd}' | chpasswd", shell=True, check=True)
                      
                      # Başlangıçtan kaldır
                      if os.path.exists("/etc/xdg/autostart/elka-installer.desktop"):
                          os.remove("/etc/xdg/autostart/elka-installer.desktop")
                      
                      messagebox.showinfo("ELKA OS", "Yapılandırma başarıyla tamamlandı!\nSistem şimdi yeniden başlatılacak.")
                      os.system("reboot")
                  except Exception as e:
                      messagebox.showerror("Kritik Hata", f"Sistem güncellenirken bir sorun oluştu: {e}")

          if __name__ == "__main__":
              root = tk.Tk()
              ElkaOSWizard(root)
              root.mainloop()
          EOF
          sudo chmod +x build/chroot/usr/local/bin/elka-installer.py

          # Autostart: Masaüstü açıldığında tetikle
          sudo mkdir -p build/chroot/etc/xdg/autostart
          cat <<EOF | sudo tee build/chroot/etc/xdg/autostart/elka-installer.desktop
          [Desktop Entry]
          Type=Application
          Name=ELKA Installer
          Exec=sudo /usr/bin/python3 /usr/local/bin/elka-installer.py
          Terminal=false
          X-GNOME-Autostart-enabled=true
          EOF

          # Yetkilendirme: ogrenci kullanıcısı sihirbazı şifresiz açabilsin
          echo "ogrenci ALL=(ALL) NOPASSWD: /usr/bin/python3 /usr/local/bin/elka-installer.py" | sudo tee -a build/chroot/etc/sudoers

      - name: 7. ISO Paketi Oluşturma (SquashFS & Grub EFI/BIOS)
        run: |
          # 1. Sıkıştırma (XZ High Compression)
          sudo mksquashfs build/chroot build/image/live/filesystem.squashfs -comp xz -Xbcj x86 -noappend
          
          # 2. Kernel ve Initrd Hazırlığı
          KERNEL=$(ls build/chroot/boot/vmlinuz-* | head -n 1)
          INITRD=$(ls build/chroot/boot/initrd.img-* | head -n 1)
          cp "$KERNEL" build/image/live/vmlinuz
          cp "$INITRD" build/image/live/initrd
          
          # 3. GRUB Menüsü (Okul İçin Profesyonel Görünüm)
          cat <<EOF > build/image/boot/grub/grub.cfg
          set timeout=3
          set default=0
          insmod all_video
          
          menuentry "ELKA Linux Professional v1.0" {
              linux /live/vmlinuz boot=live quiet splash persistence ---
              initrd /live/initrd
          }
          menuentry "ELKA Linux (Güvenli Mod)" {
              linux /live/vmlinuz boot=live nomodeset quiet splash
              initrd /live/initrd
          }
          EOF
          
          # 4. Hibrit ISO Oluşturma
          grub-mkrescue -o elka-linux-master.iso build/image

      - name: 8. ISO Dosyasını Artifact Olarak Sun
        uses: actions/upload-artifact@v4
        with:
          name: ELKA-Linux-Ultimate-ISO
          path: elka-linux-master.iso
          
