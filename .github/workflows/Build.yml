name: Build ELKA Linux (Fast & Stable Kernel)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_VERSION: "6.6.15"
      KERNEL_FLAVOR: "elka-fast"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential bc bison flex libssl-dev \
          libelf-dev libncurses-dev dwarves \
          live-build debootstrap initramfs-tools \
          wget xz-utils git

    # ---------------- KERNEL ----------------

    - name: Download kernel
      run: |
        wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz
        tar -xf linux-${KERNEL_VERSION}.tar.xz

    - name: Configure fast & stable kernel
      run: |
        cd linux-${KERNEL_VERSION}
        make defconfig

        # ---- PANIC ÖNLEYİCİ ----
        scripts/config --enable CONFIG_EXT4_FS
        scripts/config --enable CONFIG_DEVTMPFS
        scripts/config --enable CONFIG_DEVTMPFS_MOUNT
        scripts/config --enable CONFIG_BLK_DEV_INITRD
        scripts/config --enable CONFIG_TMPFS
        scripts/config --enable CONFIG_PROC_FS
        scripts/config --enable CONFIG_SYSFS
        scripts/config --enable CONFIG_PCI
        scripts/config --enable CONFIG_SATA_AHCI
        scripts/config --enable CONFIG_VIRTIO_BLK

        # ---- SYSTEMD ----
        scripts/config --enable CONFIG_CGROUPS
        scripts/config --enable CONFIG_CGROUP_CPUACCT
        scripts/config --enable CONFIG_CGROUP_DEVICE
        scripts/config --enable CONFIG_CGROUP_FREEZER
        scripts/config --enable CONFIG_CGROUP_PIDS
        scripts/config --enable CONFIG_NAMESPACES
        scripts/config --enable CONFIG_PID_NS
        scripts/config --enable CONFIG_NET_NS

        # ---- HIZLI BOOT (DEBUG KAPALI) ----
        scripts/config --disable CONFIG_DEBUG_KERNEL
        scripts/config --disable CONFIG_DEBUG_INFO
        scripts/config --disable CONFIG_DEBUG_FS
        scripts/config --disable CONFIG_FTRACE
        scripts/config --disable CONFIG_FUNCTION_TRACER
        scripts/config --disable CONFIG_STACKTRACE
        scripts/config --disable CONFIG_KALLSYMS
        scripts/config --disable CONFIG_PROFILING
        scripts/config --disable CONFIG_LATENCYTOP

        # ---- KERNEL İSMİ ----
        scripts/config --set-str CONFIG_LOCALVERSION "-${KERNEL_FLAVOR}"

        make olddefconfig

    - name: Build kernel
      run: |
        cd linux-${KERNEL_VERSION}
        make -j$(nproc)
        sudo make modules_install
        sudo make install

    - name: Create initramfs (panic blocker)
      run: |
        sudo update-initramfs -c -k ${KERNEL_VERSION}-${KERNEL_FLAVOR}

    # ---------------- LIVE ISO ----------------

    - name: Configure live-build
      run: |
        lb clean
        lb config \
          --distribution bookworm \
          --binary-images iso-hybrid \
          --linux-packages linux-image-${KERNEL_VERSION}-${KERNEL_FLAVOR}

    - name: ELKA Linux branding
      run: |
        mkdir -p config/includes.chroot/etc
        cat <<EOF > config/includes.chroot/etc/os-release
        NAME="ELKA Linux"
        ID=elka
        PRETTY_NAME="ELKA Linux"
        VERSION="1.0"
        VERSION_ID="1.0"
        EOF
        echo "ELKA Linux 1.0" > config/includes.chroot/etc/issue

    - name: Build ISO
      run: |
        sudo lb build

    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: elka-linux-fast-iso
        path: "*.iso"
