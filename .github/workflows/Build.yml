name: ELKA Linux ISO Build (amd64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            debootstrap \
            squashfs-tools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            xorriso \
            isolinux \
            syslinux-utils \
            coreutils \
            dosfstools \
            mtools

      - name: Bootstrap Debian Bookworm
        run: |
          sudo debootstrap \
            --arch=amd64 \
            bookworm \
            rootfs \
            http://deb.debian.org/debian

      - name: Copy ELKA Installer & Configs
        run: |
          sudo mkdir -p rootfs/usr/share/elka-installer
          sudo cp -r config/elka-installer/* rootfs/usr/share/elka-installer/

      - name: Add first boot service
        run: |
          sudo chroot rootfs /bin/bash <<'EOF'
          cat <<EOT > /usr/local/bin/elka-firstboot
          #!/bin/bash
          /usr/share/elka-installer/elka-installer
          systemctl disable elka-firstboot.service
          EOT
          chmod +x /usr/local/bin/elka-firstboot
          
          cat <<EOT > /etc/systemd/system/elka-firstboot.service
          [Unit]
          Description=ELKA First Boot Setup
          After=graphical.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/elka-firstboot

          [Install]
          WantedBy=graphical.target
          EOT

          systemctl enable elka-firstboot.service
          EOF

      - name: Build SquashFS
        run: |
          sudo mksquashfs rootfs elka-rootfs.squashfs -comp xz

      - name: Prepare ISO directory
        run: |
          mkdir iso
          cp -r boot iso/
          cp elka-rootfs.squashfs iso/

      - name: Build ISO with xorriso
        run: |
          xorriso -as mkisofs \
            -o ELKA-Linux-amd64.iso \
            -volid "ELKA_LINUX" \
            -eltorito-boot boot/isolinux/isolinux.bin \
            -eltorito-catalog boot/isolinux/boot.cat \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
            -eltorito-alt-boot \
            -e boot/grub/efi.img \
            -no-emul-boot \
            iso/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELKA-Linux-amd64
          path: ELKA-Linux-amd64.iso
